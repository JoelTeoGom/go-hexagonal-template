services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: login
      MYSQL_USER: login
      MYSQL_PASSWORD: login
    ports:
      - "3306:3306"
    volumes:
      # MySQL runs the .sql files in this folder when creating the database
      - ./migrations:/docker-entrypoint-initdb.d
